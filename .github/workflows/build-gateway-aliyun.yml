name: Build Gateway Image (Aliyun)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full Aliyun image tag, e.g. registry.cn-hangzhou.aliyuncs.com/xiaobin_docker/sgl-model-gateway:vX.Y.Z"
        required: true
        type: string

env:
  ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Registry
        run: |
          echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | docker login "$ALIYUN_REGISTRY" -u "${{ secrets.ALIYUN_REGISTRY_USER }}" --password-stdin

      - name: Build and push gateway image
        run: |
          docker buildx build . -f docker/gateway.Dockerfile \
            -t "${{ inputs.image_tag }}" \
            --push
